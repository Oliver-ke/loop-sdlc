name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validate task files
        run: npm run tasks:validate
      - name: Typecheck, lint, test, build
        run: npm run verify

  pr-rules:
    name: pr-rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # No job-level `if:`, deliberately. A skipped job SATISFIES a required status
    # check (GitHub: a required check must be "successful, skipped, or neutral"),
    # so any condition that skips this job would silently make the guardrail
    # optional while still showing green. The event test lives in the step below,
    # which always reports a real conclusion. Never add an `if:` here, and never
    # add `paths:`/`paths-ignore:` filters to `on:`.
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Check guardrails
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "pr-rules: not a pull request event ($EVENT) — nothing to check"
            exit 0
          fi
          git fetch --no-tags origin "$BASE_REF"
          node harness/src/cli/check-pr.mjs --base "origin/$BASE_REF" --author "$PR_AUTHOR"
